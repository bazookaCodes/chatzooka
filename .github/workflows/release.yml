# Builds installers for Windows (setup.exe), macOS (one universal .dmg) and Linux (.deb and
# .AppImage) and attaches them to a draft GitHub Release with a "which file?" guide,
# plus signed update files and latest.json for auto-update. Installed copies see the update once
# the draft is published. Runs when a version tag (e.g. v0.1.0) is pushed, or manually from the
# Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # One "universal" Mac app that runs on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies of Chatzooka only accept genuine updates.
          # Set both in the repo's Settings → Secrets and variables → Actions (paste with no
          # trailing line break).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Chatzooka v__VERSION__"
          releaseBody: |
            ## Which file do I download?

            | Your computer | Download this |
            |---|---|
            | **Windows** 10 / 11 | `Chatzooka_…_x64-setup.exe` |
            | **Mac** (any: Apple Silicon or Intel) | `Chatzooka_…_universal.dmg` |
            | **Linux** (Ubuntu, Debian, Mint, Pop!_OS) | `Chatzooka_…_amd64.deb` |
            | **Linux** (any other) | `Chatzooka_…_amd64.AppImage` |

            You can ignore the other files (`.sig`, `.tar.gz`, `latest.json`). They're used by Chatzooka's automatic updates.

            **First launch:** Chatzooka isn't code-signed, so your system may warn you once.
            - **Windows:** on "Windows protected your PC", click **More info → Run anyway**.
            - **Mac:** right-click Chatzooka in Applications, choose **Open**, then **Open** again.

            Already installed? Chatzooka offers the update itself (or use Settings → General → Updates).

            Chatzooka needs [Streamer.bot](https://streamer.bot) running; see the [setup guide](https://github.com/bazookaCodes/chatzooka#streamerbot-setup).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Publish latest.json (what installed copies check for updates).
          includeUpdaterJson: true
