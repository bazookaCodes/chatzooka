# Builds installers for Windows, macOS and Linux and attaches them to a draft GitHub Release,
# plus signed update files and latest.json for auto-update. Installed copies see the update once
# the draft is published. Runs when a version tag (e.g. v0.1.0) is pushed, or manually from the
# Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The update-signing key and password sign the update files so installed copies of
      # Chatzooka only accept genuine updates (set both in Settings → Secrets and variables →
      # Actions). Pasting them often adds a trailing line break, which breaks the key, so strip
      # whitespace before handing them to Tauri.
      - name: Prepare update-signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          password="$(printf '%s' "$PASSWORD" | tr -d '\r\n')"
          if [ -z "$key" ]; then echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing or empty."; exit 1; fi
          echo "::add-mask::$key"
          echo "::add-mask::$password"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Chatzooka v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Publish latest.json (what installed copies check for updates); on Windows, update
          # with the setup.exe installer rather than the .msi.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
